image: python:3.12-slim

pipelines:
  default:
    - step:
        name: Lint backend
        caches:
          - pip
        script:
          - pip install -r backend/requirements.txt
          - cd backend && flake8
    - step:
        name: Run backend tests
        caches:
          - pip
        script:
          - pip install -r backend/requirements.txt
          - cd backend && pytest --cov=app --cov-fail-under=70

  pull-requests:
    main:
      - step:
          name: Lint backend
          caches:
            - pip
          script:
            - pip install -r backend/requirements.txt
            - cd backend && flake8
      - step:
          name: Run backend tests
          caches:
            - pip
          script:
            - pip install -r backend/requirements.txt
            - cd backend && pytest --cov=app --cov-fail-under=70

  branches:
    main:
      - step:
          name: Lint backend
          caches:
            - pip
          script:
            - pip install -r backend/requirements.txt
            - cd backend && flake8
      - step:
          name: Run backend tests
          caches:
            - pip
          script:
            - pip install -r backend/requirements.txt
            - cd backend && pytest --cov=app --cov-fail-under=70
