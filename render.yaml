services:
  - name: energytracker-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production

  - name: energytracker-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://energytracker-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
